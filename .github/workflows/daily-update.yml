name: Daily Project Update Test

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Make daily update
        run: |
          echo "Test automated update: $(date -u)" > DAILY_STATUS_TEST.md

      - name: Commit changes
        run: |
          git config user.name "atharvk-43"
          git config user.email "194505536+atharvk-43@users.noreply.github.com"

          git add DAILY_STATUS_TEST.md

          git diff --cached --quiet || git commit -m "chore: scheduled update test"

          git push
